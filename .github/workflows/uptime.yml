name: Uptime Monitor

# Checks the deployed site and wakes it if Render has put it to sleep. The service keeps
# itself awake between checks (backend/main.py, _keep_awake), because GitHub's scheduler
# delays or drops runs and cannot hold a 15-minute idle window on its own.
on:
  schedule:
    # Off the hour (GitHub drops more runs at :00). Every 30 minutes keeps this private
    # repo inside the free Actions minutes, since each run bills a full minute.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: Site to check (defaults to the UPTIME_URL variable, then the Render app)
        required: false
        default: ''

permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  ping:
    name: Ping /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping /api/health
        env:
          TARGET: ${{ inputs.url || vars.UPTIME_URL || 'https://somaiyanet-app.onrender.com' }}
        run: |
          base="${TARGET%/}"
          base="${base%/api/health}"
          url="$base/api/health"
          echo "Checking $url"

          # A sleeping free instance takes up to a minute to boot; Render answers 502/503 meanwhile.
          status=000
          for attempt in 1 2 3 4 5; do
            rm -f body.txt
            result=$(curl -sS -o body.txt -w '%{http_code} %{time_total}' --max-time 90 "$url" || true)
            status=${result% *}
            seconds=${result#* }
            echo "Attempt $attempt: HTTP $status in ${seconds}s"
            if grep -qi 'suspended' body.txt 2>/dev/null; then
              echo "::error ::$base is suspended on Render. Resume it in the dashboard or point UPTIME_URL at the live service."
              exit 1
            fi
            if [ "$status" = 200 ] && grep -q '"ok": *true' body.txt; then
              break
            fi
            [ "$attempt" -lt 5 ] && sleep 15
          done

          {
            echo "### Uptime check"
            echo "| Endpoint | HTTP | Time | Attempts | Checked (UTC) |"
            echo "|---|---|---|---|---|"
            echo "| \`$url\` | $status | ${seconds}s | $attempt | $(date -u '+%Y-%m-%d %H:%M') |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" != 200 ] || ! grep -q '"ok": *true' body.txt; then
            echo "::error ::$url did not report healthy after $attempt attempts (last HTTP $status)."
            head -c 500 body.txt 2>/dev/null
            exit 1
          fi
          echo "Healthy."
